<!-- @dsCard height=288 -->
<!doctype html>
<html dir="rtl" lang="ar">
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; background: var(--ground); }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--ground); }
  .cv svg { position: absolute; inset: 0; }
  .violet { fill: var(--violet); }
  .gold { fill: var(--gold-bright); }
  .glass { fill: var(--glass-raised); }
  .tile { rx: var(--radius-card); ry: var(--radius-card); }
  .star { fill: none; stroke: var(--gold-deep); stroke-width: 1.5; }
  .star-cut { fill: none; stroke: var(--ground); stroke-width: 2; }
  .thread { fill: var(--gold-bright); }
  .txt { position: absolute; left: 40px; bottom: 36px; width: 440px; direction: rtl; text-align: left; }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 84px; line-height: 1.05; color: var(--text); margin: 0; }
  .tag { font-family: var(--font-ui); font-size: 14px; color: var(--text-muted); margin-top: 8px; }
</style></head>
<body>
<div class="cv">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: violet slab 168×288+ bleeding top/right/bottom; gold-bright tile 240×112; glass-raised tile 240×(136+bleed); radius-card corners.
      arrangement: one tall slab with two stacked satellites, card-gap (12) + card-pad-lg (24) gutters, right of x=480.
      pattern: the brand's own eight-point star (two squares, one turned 45°) — the lattice the app reserves for reflection; three gold-deep stars on the glass tile, one cut in ground through the slab.
      scales: gap 24 (card-pad-lg), 12 (card-gap), radius-card 24, star 56 at an 80 pitch (20·grid), stroke 1.5 (icon-stroke).
    -->
    <rect class="violet" x="792" y="-24" width="192" height="336" />
    <rect class="gold tile" x="528" y="24" width="240" height="112" />
    <rect class="glass tile" x="528" y="148" width="240" height="164" />
    <g class="star">
      <rect x="548" y="184" width="40" height="40" /><rect x="548" y="184" width="40" height="40" transform="rotate(45 568 204)" />
      <rect x="628" y="184" width="40" height="40" /><rect x="628" y="184" width="40" height="40" transform="rotate(45 648 204)" />
      <rect x="708" y="184" width="40" height="40" /><rect x="708" y="184" width="40" height="40" transform="rotate(45 728 204)" />
    </g>
    <g class="star-cut">
      <rect x="836" y="100" width="88" height="88" /><rect x="836" y="100" width="88" height="88" transform="rotate(45 880 144)" />
    </g>
  </svg>
  <div class="txt">
    <p class="name">الحمد — ليل</p>
    <div class="tag">نعمةٌ كلَّ يوم</div>
  </div>
</div>
</body>
</html>
